<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Reply Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f5f5;
      color: #222;
    }
    h1 { font-size: 1.5rem; }
    textarea {
      width: 100%;
      height: 140px;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 6px;
    }
    button {
      margin-top: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      background: #1a7f5a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { background: #8bbfae; cursor: not-allowed; }
    #output {
      margin-top: 20px;
      padding: 14px;
      background: white;
      border-left: 4px solid #1a7f5a;
      border-radius: 6px;
      white-space: pre-wrap;
      display: none;
    }
    #output.error { border-left-color: #c0392b; color: #c0392b; }
  </style>
</head>
<body>
  <h1>Complaint Reply Tool</h1>
  <p>Paste the customer's complaint below.</p>

  <textarea id="complaint" placeholder="Paste the complaint here..."></textarea>
  <button id="generate-btn">Generate Reply</button>

  <div id="output"></div>

  <script>
    const complaintBox = document.getElementById("complaint");
    const button = document.getElementById("generate-btn");
    const output = document.getElementById("output");

    function showMessage(text, isError) {
      output.textContent = text;
      output.className = isError ? "error" : "";
      output.style.display = "block";
    }

    button.addEventListener("click", async () => {
      const complaint = complaintBox.value.trim();

      if (!complaint) {
        showMessage("Please paste a complaint first.", true);
        return;
      }

      button.disabled = true;
      button.textContent = "Generating...";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ complaint: complaint })
        });
        const data = await response.json();

        if (response.ok) {
          showMessage(data.reply, false);
        } else {
          showMessage(data.error || "Something went wrong.", true);
        }
      } catch (error) {
        showMessage("Could not reach the server. Please check your connection and try again.", true);
      } finally {
        button.disabled = false;
        button.textContent = "Generate Reply";
      }
    });
  </script>
</body>
</html>
